services:
  - type: web
    name: greenlane-rp-portal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: greenlane-rp-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APPLICATIONS_CHANNEL_ID
        sync: false
      - key: DISCORD_STAFF_ROLE_IDS
        sync: false
      - key: DISCORD_RULES_ADMIN_ROLE_IDS
        sync: false
      - key: SUPER_ADMIN_USER_IDS
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
databases:
  - name: greenlane-rp-db
    plan: basic-256mb
